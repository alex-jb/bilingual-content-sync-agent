[project]
name = "bilingual-content-sync-agent"
version = "0.4.0"
description = "Solo Founder OS agent #4 — keep EN/ZH locale JSON in sync via Claude + HITL markdown review."
authors = [{ name = "Alex Ji", email = "alex@vibexforge.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",
    "solo-founder-os>=0.5.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Internationalization",
]
keywords = ["i18n", "localization", "translation", "claude", "indie"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "mcp>=1.0"]

[project.scripts]
bilingual-sync = "bilingual_sync.__main__:main"
bilingual-content-sync-agent = "bilingual_sync.__main__:main"
bilingual-sync-mcp = "bilingual_sync.mcp_server:main"

[project.urls]
Repository = "https://github.com/alex-jb/bilingual-content-sync-agent"
Issues = "https://github.com/alex-jb/bilingual-content-sync-agent/issues"
Homepage = "https://github.com/alex-jb/bilingual-content-sync-agent"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bilingual_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line-length: docstrings + log messages run long; not a bug
    "E731",  # lambda-assignment: idiomatic in tests
    "E402",  # module-level import not at top: __future__ + sys.path tricks
    "E702",  # multiple-statements-on-one-line: idiomatic in test fixtures
    "E741",  # ambiguous-variable-name: short loop vars are fine in context
]
